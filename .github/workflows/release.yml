# NOTE: npm trusted publishing (OIDC) is bound to this file's path.
# The npm trusted-publisher config for @hulistmi/hulistmi names
# `tolunayozturk/hulistmi.ai` + `release.yml`. Renaming or moving this file
# breaks publishing (the version PR still opens; `changeset publish` fails
# auth). Update the publisher entry on npmjs.com first if you must rename it.
name: Release
on:
  push:
    branches: [master]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build:check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # npm trusted publishing (OIDC) + provenance
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Normal path: the version bump was made on `dev` (npm run
      # version:packages) and rode in with the release PR, so no changesets are
      # pending here -> publish to npm + push the v<version> tag.
      # Fallback: someone merged code with changesets still pending -> open a
      # "Version Packages" PR instead of publishing. Either way master is never
      # pushed to directly, so it can stay protected with no bypass actor.
      - name: Version or publish
        id: changesets
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          version: npm run version:packages
          publish: npx changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Guard: a code change reached master without a changeset, so no release will
  # ever be cut for it. Fail loudly instead of silently skipping.
  verify:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false' && needs.release.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check this push is either a version bump or release-irrelevant
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "Version ${version} is unreleased; publish step will handle it."
            exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -qE '^(src|bin|public)/'; then
            echo "::error::Code changed under src/, bin/ or public/ but no changeset is pending" \
                 "and v${version} is already released. Add a changeset so this ships."
            exit 1
          fi
          echo "No release-relevant changes in this push."


  # Keeps the live Worker in step with what was just published to npm.
  # Cloudflare is not covered by npm's OIDC trust, so this needs a stored token.
  deploy:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
